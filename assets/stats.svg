<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="150" viewBox="0 0 1000 150" role="img" aria-label="2,000+ paying hotel customers. About 200 hotels on recurring subscription. Retvens acquired 2026. Cloud incidents resolved in under 30 seconds, down from 4 to 6 hours.">
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .tile { animation: up .45s ease-out both; }
    .a1 { animation-delay: 0s } .a2 { animation-delay: .1s } .a3 { animation-delay: .2s } .a4 { animation-delay: .3s }
    @keyframes up { from { opacity: 0; transform: translateY(14px) } to { opacity: 1; transform: translateY(0) } }
    .bar { transform-origin: left; transform-box: fill-box; animation: grow .8s .4s ease-out both; }
    @keyframes grow { from { transform: scaleX(0) } to { transform: scaleX(1) } }
  </style>
  <g class="tile a1">
    <rect x="0" y="0" width="238" height="150" rx="18" fill="#16181D"/>
    <text x="24" y="66" class="mono" font-size="40" font-weight="700" fill="#F08A4B">2,000+</text>
    <text x="24" y="98" class="sans" font-size="14" fill="#D5D8DE">paying hotel customers</text>
    <text x="24" y="118" class="sans" font-size="14" fill="#8E929B">across two AI products</text>
    <rect class="bar" x="24" y="132" width="190" height="3" rx="1.5" fill="#F08A4B"/>
  </g>
  <g class="tile a2">
    <rect x="254" y="0" width="238" height="150" rx="18" fill="#16181D"/>
    <text x="278" y="66" class="mono" font-size="40" font-weight="700" fill="#7FD1CC">~200</text>
    <text x="278" y="98" class="sans" font-size="14" fill="#D5D8DE">hotels on recurring</text>
    <text x="278" y="118" class="sans" font-size="14" fill="#8E929B">subscription, KnowMyHotel</text>
    <rect class="bar" x="278" y="132" width="190" height="3" rx="1.5" fill="#7FD1CC"/>
  </g>
  <g class="tile a3">
    <rect x="508" y="0" width="238" height="150" rx="18" fill="#16181D"/>
    <text x="532" y="66" class="mono" font-size="40" font-weight="700" fill="#F08A4B">2026</text>
    <text x="532" y="98" class="sans" font-size="14" fill="#D5D8DE">Retvens acquired by</text>
    <text x="532" y="118" class="sans" font-size="14" fill="#8E929B">RBS Software Solutions</text>
    <rect class="bar" x="532" y="132" width="190" height="3" rx="1.5" fill="#F08A4B"/>
  </g>
  <g class="tile a4">
    <rect x="762" y="0" width="238" height="150" rx="18" fill="#16181D"/>
    <text x="786" y="66" class="mono" font-size="40" font-weight="700" fill="#7FD1CC">&lt;30s</text>
    <text x="786" y="98" class="sans" font-size="14" fill="#D5D8DE">incident resolution,</text>
    <text x="786" y="118" class="sans" font-size="14" fill="#8E929B">down from 4–6 h</text>
    <rect class="bar" x="786" y="132" width="190" height="3" rx="1.5" fill="#7FD1CC"/>
  </g>
</svg>
