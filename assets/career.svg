<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700" role="img" aria-label="Career timeline. Feb 2026: Retvens acquired by RBS Software Solutions. Nov 2025: AI Research Intern, Walmart Center for Tech Excellence, IIT Madras. Jul 2025: M.Sc. Data Science and AI, IIT Madras and University of Birmingham. 2025: Winner, Nutanix Hackathon; finalist, UKFinnovator. Apr 2023: co-founded Retvens Services as Head of Technology. Oct 2022: Senior Associate, Engineering, Thotnr. Nov 2020: Senior Operations Executive, Infosys.">
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .in { animation: in .45s ease-out both; }
    .c1 { animation-delay: .05s } .c2 { animation-delay: .15s } .c3 { animation-delay: .25s } .c4 { animation-delay: .35s }
    .c5 { animation-delay: .45s } .c6 { animation-delay: .55s } .c7 { animation-delay: .65s }
    @keyframes in { from { opacity: 0; transform: translateY(10px) } to { opacity: 1; transform: translateY(0) } }
    .spine { stroke-dasharray: 600; animation: draw 1s ease-out both; }
    @keyframes draw { from { stroke-dashoffset: 600 } to { stroke-dashoffset: 0 } }
    .pulse { animation: pulse 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes pulse { 50% { transform: scale(1.6); opacity: .25 } }
  </style>
  <rect width="1000" height="700" rx="22" fill="#16181D"/>
  <text x="40" y="48" class="mono" font-size="15" fill="#7FD1CC">~/shivam $ git log --career</text>
  <text x="960" y="48" class="mono" font-size="13" fill="#5B5F68" text-anchor="end">HEAD → present</text>

  <line class="spine" x1="500" y1="80" x2="500" y2="670" stroke="#3A3E46" stroke-width="2"/>

  <!-- 1 · acquired (right) -->
