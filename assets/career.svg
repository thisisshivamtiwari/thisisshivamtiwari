    <rect x="40" y="166" width="430" height="62" rx="12" fill="#1E2127" stroke="#2E323A"/>
    <text x="60" y="192" class="sans" font-size="16" font-weight="700" fill="#F6F3EC">AI Research Intern · Walmart CTE, IIT Madras</text>
    <text x="60" y="214" class="sans" font-size="13" fill="#B9BCC4">Multi-agent LLM framework for MSME spreadsheets · grade A</text>
